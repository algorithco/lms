# ============================================================================
# LMS Platform — Production Docker Compose
#
# Usage:
#   cp .env.prod.example .env.prod      # fill in real secrets
#   ./deploy/init-letsencrypt.sh example.com you@email.com   # first run (SSL)
#   docker compose -f docker-compose.prod.yml up -d
# ============================================================================

name: lms-platform-prod

services:
  # --------------------------------------------------------------------------
  # Django (ASGI — HTTP + WebSocket via daphne)
  # --------------------------------------------------------------------------
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    # daphne serves HTTP and WebSockets (Arena real-time quiz)
    # --application-close-timeout=60: worker yo'q qilinganda (deploy/restart)
    # in-flight request'lar tugashiga 60s beradi. Default (10s) yetmasligi
    # "Application instance ... took too long to shut down and was killed"
    # logini berar edi (ayniqsa LLM polling request'lari davom etayotganda).
    # Eslatma: submit endpoint'lari endi asinxron — request'lar o'zi tez;
    # bu flag baribir deploy chog'ida WebSocket/polling uzilmasligi uchun.
    command: >
      daphne -b 0.0.0.0 -p 8000 --proxy-headers
      --application-close-timeout 60
      config.asgi:application
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz/"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # --------------------------------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-lms_platform}
      POSTGRES_USER: ${DB_USER:-lms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.prod}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lms_user} -d ${DB_NAME:-lms_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Redis (Celery broker + Channels channel layer + cache)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Celery worker
  #   -O fair: vazifalarni bo'sh worker'larga taqsimlaydi — uzun (LLM) task
  #   boshqa task'larni bir worker'da to'sib qo'ymasligi uchun.
  #   --max-tasks-per-child: har 200 task'dan keyin child process restart —
  #   xotira sizishiga qarshi.
  #   Eslatma: essa baholash task'ining o'z limitlari bor (time_limit=240),
  #   bu yerda faqat umumiy pool sozlamalari.
  # --------------------------------------------------------------------------
  celery-worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SKIP_DB_STARTUP: "1"   # web xizmati migrate/collectstatic qiladi
    volumes:
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info --concurrency=2 -O fair --max-tasks-per-child=200
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME | grep -q 'pong'"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # --------------------------------------------------------------------------
  # Celery beat (periodic tasks: timeout checks, daily maintenance, ...)
  # --------------------------------------------------------------------------
  celery-beat:
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SKIP_DB_STARTUP: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l info --schedule=/tmp/celerybeat-schedule
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if __import__('os').path.exists('/tmp/celerybeat-schedule') else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # --------------------------------------------------------------------------
  # Telegram bot (long polling — production-simple; webhook optional)
  # --------------------------------------------------------------------------
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SKIP_DB_STARTUP: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python manage.py run_bot
    healthcheck:
      # Liveness probe: PID 1 must still be the run_bot process (a crash/exit
      # would replace it and fail this check, triggering restart).
      test: ["CMD", "python", "-c", "import sys; data=open('/proc/1/cmdline','rb').read(); sys.exit(0 if b'run_bot' in data else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # --------------------------------------------------------------------------
  # Nginx (reverse proxy + HTTPS termination + static/media)
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # --------------------------------------------------------------------------
  # Let's Encrypt (certbot) — one-shot issuance, renewal loop
  # --------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done'
    healthcheck:
      # Liveness probe: PID 1 must still be the certbot renewal loop.
      test: ["CMD", "python", "-c", "import sys; data=open('/proc/1/cmdline','rb').read(); sys.exit(0 if b'certbot' in data else 1)"]
      interval: 6h
      timeout: 10s
      start_period: 30s
      retries: 2

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  certbot_conf:
  certbot_www: