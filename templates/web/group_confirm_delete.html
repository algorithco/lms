{% extends "base.html" %}
{% block title %}{{ group.name }} — o'chirish{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-16">
    <div class="bg-white rounded-2xl shadow-card border border-surface-100 p-8 text-center">
        <div class="w-16 h-16 mx-auto mb-6 rounded-2xl bg-rose-100 flex items-center justify-center">
            <span class="text-3xl">🗑️</span>
        </div>
        <h2 class="text-xl font-extrabold text-surface-900 mb-2">Guruhni o'chirish</h2>
        <p class="text-surface-500 mb-6">
            <strong>"{{ group.name }}"</strong> guruhini o'chirishni xohlaysizmi?<br>
            <span class="text-sm text-surface-400">Bu amal qaytarib bo'lmaydi. Talabalar o'z-o'zidan guruhdan chiqariladi.</span>
        </p>

        <div class="flex gap-3">
            <form method="post" class="flex-1">
                {% csrf_token %}
                <button type="submit"
                        class="w-full py-3 px-6 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-xl shadow-md transition-all">
                    Ha, o'chirish
                </button>
            </form>
            <a href="{% url 'web:group-list' %}"
               class="flex-1 py-3 px-6 bg-surface-100 hover:bg-surface-200 text-surface-700 font-semibold rounded-xl transition-all text-center">
                Bekor qilish
            </a>
        </div>
    </div>
</div>
{% endblock %}
