{% extends "base.html" %}
{% load i18n_extras %}
{% block title %}{% t "reset_complete_title" %} — Ona Tili & Adabiyot{% endblock %}
{% block auth_content %}
<main class="min-h-screen flex items-center justify-center bg-surface-50 dark:bg-[#071313] px-4 py-12">
  <section class="w-full max-w-md rounded-2xl border border-surface-200 dark:border-emerald-900/60 bg-white dark:bg-[#0C1D1B] p-6 sm:p-8 text-center shadow-card" aria-labelledby="reset-complete-heading" role="status">
    <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-full bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300" aria-hidden="true">✓</div>
    <h1 id="reset-complete-heading" class="text-2xl font-extrabold text-surface-900 dark:text-white">{% t "reset_complete_title" %}</h1>
    <p class="mt-3 text-sm leading-6 text-surface-600 dark:text-surface-300">{% t "reset_complete_body" %}</p>
    <a href="{% url 'web:login' %}" class="mt-7 inline-flex rounded-xl bg-emerald-600 px-5 py-3 font-semibold text-white hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-400">{% t "login" %}</a>
  </section>
</main>
{% endblock %}
