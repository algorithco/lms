{% load i18n_extras %}
{% if success %}
<div class="p-5 rounded-2xl bg-amber-50 border border-amber-200">
    <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center flex-shrink-0">
            <svg class="w-5 h-5 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
        <div>
            <h4 class="text-sm font-bold text-amber-800">✅ {% t "essay_review_requested" %}</h4>
            <p class="text-xs text-amber-700 mt-1">
                {% t "essay_review_requested_hint" %}
            </p>
        </div>
    </div>
</div>
{% else %}
<div class="p-4 rounded-2xl bg-rose-50 border border-rose-200 flex items-center gap-3">
    <span class="text-2xl">❌</span>
    <div>
        <p class="text-sm font-bold text-rose-700">{% t "essay_error" %}</p>
        <p class="text-xs text-rose-600">{{ error }}</p>
    </div>
</div>
{% endif %}
