{% load i18n_extras %}
{% if auto_submitted %}
<div class="lcard rounded-3xl p-6 text-center ring-1 ring-amber-200/70 dark:ring-amber-500/30 shadow-card" id="auto-submit-notice">
    <div class="w-12 h-12 rounded-xl bg-amber-100 dark:bg-amber-500/15 flex items-center justify-center mx-auto mb-3">
        <svg class="w-6 h-6 text-amber-600 dark:text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
    </div>

    {% if fallback %}
        <h3 class="text-sm font-bold text-amber-800 dark:text-amber-200 mb-1">{% t "essay_auto_teacher" %}</h3>
        <p class="text-xs text-amber-600 dark:text-amber-400/80 mb-3">{% t "essay_auto_teacher_hint" %}</p>
    {% else %}
        <h3 class="text-sm font-bold text-amber-800 dark:text-amber-200 mb-1">{% t "essay_auto_graded" %}</h3>
        <p class="text-xs text-amber-600 dark:text-amber-400/80 mb-3">{% t "essay_auto_graded_hint" %}</p>
    {% endif %}

    <a href="{% url 'essays:result' submission_id=submission.id %}"
       class="inline-flex items-center gap-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl transition-colors btn-glow">
        📊 {% t "essay_view_result" %}
    </a>
</div>

<script>
// Disable textarea and submit button
document.getElementById('essay-textarea').readOnly = true;
var submitBtn = document.getElementById('submit-btn');
if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.innerHTML = '⏰ ' + {{ essay_time_up|escapejs }};
    submitBtn.className = 'inline-flex items-center justify-center gap-2 px-7 py-3 bg-surface-300 dark:bg-white/10 text-surface-500 dark:text-surface-400 text-sm font-bold rounded-2xl cursor-not-allowed';
}
</script>
{% endif %}
