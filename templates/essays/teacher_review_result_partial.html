{% load i18n_extras %}
{% if success %}
<div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 flex items-center gap-3">
    <span class="text-2xl">✅</span>
    <div>
        <p class="text-sm font-bold text-emerald-700">{% t "essay_score_saved" %}</p>
        <p class="text-xs text-emerald-600">
            {% t "essay_final_score" %} <strong>{{ review.final_score }}/24</strong>
            · {% t "essay_student_label" %} {{ submission.student.get_full_name }}
        </p>
    </div>
</div>
{% else %}
<div class="p-4 rounded-2xl bg-rose-50 border border-rose-200 flex items-center gap-3">
    <span class="text-2xl">❌</span>
    <div>
        <p class="text-sm font-bold text-rose-700">{% t "essay_error" %}</p>
        <p class="text-xs text-rose-600">{{ error }}</p>
    </div>
</div>
{% endif %}
