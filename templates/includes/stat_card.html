<!--
  Reusable Stat Card Partial Template
  
  Usage:
    {% include "includes/stat_card.html" with 
        gradient="stat-gradient-blue" 
        icon_color="text-blue-600" 
        icon_bg="bg-blue-500/10"
        label="Topshirilgan testlar" 
        value=stats.total_tests 
        trend="+12%" 
        trend_text="o'tgan oyga nisbatan"
        trend_color="text-emerald-600"
        icon_svg="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
    %}
-->
<div class="stat-card {{ gradient|default:'stat-gradient-blue' }} rounded-2xl p-5 border
    {% if gradient == 'stat-gradient-blue' %}border-blue-100/60
    {% elif gradient == 'stat-gradient-green' %}border-emerald-100/60
    {% elif gradient == 'stat-gradient-amber' %}border-amber-100/60
    {% elif gradient == 'stat-gradient-purple' %}border-purple-100/60
    {% else %}border-blue-100/60{% endif %}">
    <div class="flex items-start justify-between">
        <div>
            <p class="text-[11px] font-semibold {{ label_color|default:'text-blue-600/80' }} uppercase tracking-wider">{{ label }}</p>
            <p class="text-3xl font-extrabold {{ value_color|default:'text-blue-900' }} mt-1">{{ value }}{% if suffix %}<span class="text-xl">{{ suffix }}</span>{% endif %}</p>
        </div>
        <div class="w-11 h-11 rounded-2xl {{ icon_bg|default:'bg-blue-500/10' }} flex items-center justify-center">
            <svg class="w-5 h-5 {{ icon_color|default:'text-blue-600' }}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="{{ icon_svg }}"/>
            </svg>
        </div>
    </div>
    <div class="flex items-center mt-3">
        {% if trend %}
        <span class="inline-flex items-center text-[11px] font-semibold {{ trend_color|default:'text-blue-600' }}">
            {% if trend_icon == 'up' %}
            <svg class="w-3.5 h-3.5 mr-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
            </svg>
            {% elif trend_icon == 'chart' %}
            <svg class="w-3.5 h-3.5 mr-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
            </svg>
            {% endif %}
            {{ trend }}
        </span>
        {% endif %}
        {% if trend_text %}
        <span class="text-[11px] {{ trend_text_color|default:'text-blue-500/60' }} ml-2">{{ trend_text }}</span>
        {% endif %}
    </div>
</div>
