<!--
  Reusable Empty State Partial Template

  Usage:
    {% include "includes/empty_state.html" with 
        title="Hali testlar yo'q" 
        description="O'qituvchilar yangi testlar yaratganda, ular shu yerda paydo bo'ladi."
        illustration_color="#ecfeff"
        illustration_stroke="#a5f3fc"
        icon_stroke="#0ea5e9"
        cta_url="{% url 'web:test-list' %}"
        cta_text="Testlarni ko'rish"
    %}
-->
<div class="p-12 text-center">
    <div class="empty-state-float inline-block mb-6">
        <svg class="w-24 h-24 mx-auto" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="90" fill="{{ illustration_color|default:'#ecfeff' }}" stroke="{{ illustration_stroke|default:'#a5f3fc' }}" stroke-width="2"/>
            <rect x="50" y="55" width="100" height="90" rx="10" fill="white" stroke="{{ illustration_stroke|default:'#67e8f9' }}" stroke-width="2"/>
            <circle cx="100" cy="88" r="16" fill="#f0f9ff" stroke="{{ illustration_stroke|default:'#7dd3fc' }}" stroke-width="2"/>
            <path d="M96 88 L100 92 L106 84" stroke="{{ icon_stroke|default:'#0ea5e9' }}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="75" y1="112" x2="125" y2="112" stroke="{{ illustration_stroke|default:'#bae6fd' }}" stroke-width="2" stroke-linecap="round"/>
            <line x1="80" y1="122" x2="120" y2="122" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </div>
    <h4 class="text-lg font-bold text-surface-900 mb-2">{{ title }}</h4>
    <p class="text-sm text-surface-400 max-w-sm mx-auto">
        {{ description }}
    </p>
    {% if cta_url %}
    <a href="{{ cta_url }}" class="inline-flex items-center gap-2 px-5 py-2.5 bg-brand-600 text-white text-sm font-semibold rounded-xl hover:bg-brand-700 transition-all hover:shadow-glow mt-4">
        {% if cta_icon_svg %}
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="{{ cta_icon_svg }}"/>
        </svg>
        {% endif %}
        {{ cta_text|default:"Boshlash" }}
    </a>
    {% endif %}
</div>
