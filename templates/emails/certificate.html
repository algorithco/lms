<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#f8fafc;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8fafc;padding:40px 20px;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.08);">

                    <!-- Header -->
                    <tr>
                        <td style="background:linear-gradient(135deg,#7c3aed,#6d28d9);padding:32px;text-align:center;">
                            <h1 style="margin:0;color:#ffffff;font-size:24px;font-weight:800;">Sertifikat Tayyor!</h1>
                            <p style="margin:8px 0 0;color:rgba(255,255,255,0.8);font-size:14px;">Tabriklaymiz!</p>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="padding:32px;">
                            <h2 style="margin:0 0 8px;color:#1e293b;font-size:18px;">
                                Tabriklaymiz, {{ student_name }}!
                            </h2>
                            <p style="margin:0 0 24px;color:#64748b;font-size:14px;line-height:1.6;">
                                Sizning sertifikatingiz tayyor va yuklab olishga tayyor.
                            </p>

                            <!-- Certificate Card -->
                            <table width="100%" cellpadding="0" cellspacing="0" style="background:#faf5ff;border:2px solid #e9d5ff;border-radius:12px;padding:24px;margin-bottom:24px;">
                                <tr>
                                    <td>
                                        <p style="margin:0;color:#7c3aed;font-size:12px;font-weight:600;text-transform:uppercase;">Sertifikat raqami</p>
                                        <p style="margin:4px 0 16px;color:#1e293b;font-size:18px;font-weight:800;">{{ certificate_number }}</p>

                                        <p style="margin:0;color:#7c3aed;font-size:12px;font-weight:600;text-transform:uppercase;">Kurs</p>
                                        <p style="margin:4px 0 0;color:#1e293b;font-size:14px;font-weight:600;">{{ course_title }}</p>
                                    </td>
                                </tr>
                            </table>

                            <!-- CTA -->
                            <table width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td align="center">
                                        <a href="{{ site_url }}/certificates/" style="display:inline-block;background:#7c3aed;color:#ffffff;text-decoration:none;padding:12px 32px;border-radius:8px;font-weight:600;font-size:14px;">
                                            Sertifikatni yuklab olish
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding:16px 32px;background:#f8fafc;border-top:1px solid #e2e8f0;">
                            <p style="margin:0;color:#94a3b8;font-size:11px;text-align:center;">
                                © 2026 Ona Tili & Adabiyot. Barcha huquqlar himoyalangan.
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
