# ============================================================================
# LMS Platform — Docker Compose
# ============================================================================

services:
  # Django web server (ASGI — HTTP + WebSocket via daphne, see Dockerfile)
  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 --proxy-headers config.asgi:application
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz/"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  # PostgreSQL database
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: lms_platform
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_user -d lms_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (cache + Celery broker)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Celery worker (no HTTP server — disable image HEALTHCHECK inheritance)
  # -Q celery,essay_grading: must match CELERY_TASK_ROUTES in settings —
  # essays.grade_submission etc. are routed to "essay_grading" and a worker
  # without -Q never consumes that queue (essays stuck PENDING).
  celery:
    build: .
    command: celery -A config worker -l info --concurrency=2 -O fair --max-tasks-per-child=500 -Q celery,essay_grading

    command: celery -A config worker -l info -Q celery,essay_grading --concurrency=2 -O fair --max-tasks-per-child=500

    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      SKIP_DB_STARTUP: "1"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build: .
    command: celery -A config beat -l info --schedule=/tmp/celerybeat-schedule
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      SKIP_DB_STARTUP: "1"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule && ps aux | grep -q '[c]elery beat'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Telegram bot (long-poll process — disable image HEALTHCHECK inheritance)
  bot:
    build: .
    command: python manage.py run_bot
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      SKIP_DB_STARTUP: "1"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Nginx (reverse proxy)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
