# ============================================================================
# LMS Platform — Auto-deploy to VPS (grandec.uz + admin.grandec.uz)
#
# Triggers: build.yml success on main + manual (tag input for rollback).
# Strategy: VPS pulls prebuilt ghcr.io/algorithco/lms:<tag> (no build on VPS).
#
# Required Actions secrets (Settings → Secrets → Actions, environment
# `production` — values NEVER appear in logs, GitHub masks them automatically):
#   VPS_HOST         VPS IPv4 (direct IP, not via Cloudflare proxy)
#   VPS_USER         e.g. deploy
#   VPS_SSH_KEY      BASE64 (single line, no wrapping) of the private OpenSSH
#                    key for VPS_USER (no passphrase). See step comment why.
#   VPS_SSH_PORT     e.g. 22 (optional)
#   GHCR_READ_TOKEN  fine-grained PAT, scope read:packages on algorithco/lms
#                    (used ONLY at deploy runtime; rotated periodically).
#   GHCR_USER        PAT owner username (docker login username).
#
# GHCR auth design (gap #1 — private image pull):
#   - Login happens INSIDE the SSH session with a temp DOCKER_CONFIG dir, so
#     credentials never persist in /root/.docker/config.json on the VPS.
#   - `set +x` + trap-based `docker logout` + `rm -rf $DOCKER_CONFIG` guarantee
#     the token is not echoed and not left on disk even on failure.
#   - PAT is least-privilege (read:packages only). Alternative (not used):
#     passing GITHUB_TOKEN couples the deploy to one workflow run's lifetime.
# ============================================================================

name: Deploy

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g. sha-abc1234 or latest; rollback = previous sha)"
        required: false
        default: latest

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: algorithco/lms

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4 # remote-deploy.sh is piped to VPS via stdin

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # Must match build.yml: type=sha,prefix=sha-,format=short (= 7 hex).
            SHORT_SHA="$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)"
            echo "value=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            # If short/full mismatch ever fails a pull, redeploy via
            # workflow_dispatch with tag=latest (movable, always exists).
          fi

      - name: Deploy over SSH (native OpenSSH)
        # No third-party SSH action: appleboy/drone-ssh cannot parse modern
        # OpenSSH-format ed25519 keys ("ssh: no key found"). The runner's own
        # client handles every format. Remote procedure is versioned in
        # deploy/remote-deploy.sh (reviewed via PR like any other code).
        # NOTE: VPS_SSH_KEY holds BASE64 of the private key (single line).
        # Multiline secrets get their newlines mangled somewhere between
        # `gh secret set` (Windows pipe) and the runner ("error in libcrypto"
        # on an otherwise valid key); base64 has no newlines to corrupt.
        # Rotate: base64 -w0 ~/.ssh/grandec_deploy | gh secret set VPS_SSH_KEY
        env:
          IMS_IMAGE_TAG: ${{ steps.tag.outputs.value }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$VPS_SSH_KEY" | base64 -d > ~/.ssh/lms_deploy_key
          chmod 600 ~/.ssh/lms_deploy_key
          ssh-keygen -y -f ~/.ssh/lms_deploy_key >/dev/null # fail fast: key must parse
          printf 'IMS_IMAGE_TAG=%s\nGHCR_USER=%s\nGHCR_READ_TOKEN=%s\n' \
            "${IMS_IMAGE_TAG:?}" "${GHCR_USER:?}" "${GHCR_READ_TOKEN:?}" > /tmp/lms_deploy.env
          chmod 600 /tmp/lms_deploy.env
          # Key + env file are shredded on EXIT (success or failure).
          cleanup_ci() { rm -f /tmp/lms_deploy.env ~/.ssh/lms_deploy_key; }
          trap cleanup_ci EXIT
          SSH_BASE="-i $HOME/.ssh/lms_deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new"
          SSH="ssh -p ${VPS_SSH_PORT:-22} $SSH_BASE $VPS_USER@$VPS_HOST"
          SCP="scp -P ${VPS_SSH_PORT:-22} $SSH_BASE"
          # Versioned config sync: the exact checked-out compose + preflight +
          # nginx templates land on the VPS first, so deploys never run stale
          # config. VPS-only files (.env.prod, deploy/secrets/*, logs, data,
          # generated nginx.conf) are never synced — nginx.conf is REGENERATED
          # on the VPS by remote-deploy.sh from the synced template.
          # shellcheck disable=SC2086
          $SSH "mkdir -p /tmp/lms_deploy.d"
          # shellcheck disable=SC2086
          $SCP /tmp/lms_deploy.env "$VPS_USER@$VPS_HOST:/tmp/lms_deploy.env"
          # shellcheck disable=SC2086
          $SCP docker-compose.prod.yml "$VPS_USER@$VPS_HOST:/opt/lms/docker-compose.prod.yml"
          # shellcheck disable=SC2086
          $SCP deploy/preflight.sh deploy/nginx/nginx-main.conf \
            deploy/nginx/nginx-http.conf deploy/nginx/nginx-ssl.conf \
            "$VPS_USER@$VPS_HOST:/tmp/lms_deploy.d/"
          # shellcheck disable=SC2086
          $SSH 'bash -s' < deploy/remote-deploy.sh
