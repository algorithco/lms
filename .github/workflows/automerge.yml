# Automerge — squash-merge labeled PRs when quality gates pass.
#
# WHY NOT NATIVE AUTO-MERGE:
# Native auto-merge needs branch protection on main, which needs Pro
# (private repo on Free plan -> API 403, verified 2026-09-13; repo flag
# allow_auto_merge stays false). This workflow enforces the same gates in
# Actions, so it works on any plan. See .github/BRANCH_PROTECTION.md.
#
# RULES (all must hold, otherwise the PR is left alone):
#   base == main, label `automerge`, not draft, open
#   author is repo owner or dependabot[bot]
#   checks `test` + `security` == success on the head SHA
#   no unresolved CHANGES_REQUESTED (latest review per user wins)
#   dependabot PRs additionally need 1 human APPROVED review
#   mergeable == MERGEABLE (no conflicts)
# Then: squash merge + delete head branch.
#
# SECURITY: uses pull_request_target (runs BASE code, never executes PR code —
# only GitHub API reads + merge). Safe for fork/dependabot PRs.

name: Automerge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge eligible PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: hamroqulovv
        run: |
          set -euo pipefail

          prs=$(gh pr list --repo "$REPO" --state open --base main \
            --label automerge --json number --jq '.[].number')
          [ -z "$prs" ] && { echo "No labeled PRs."; exit 0; }

          for PR in $prs; do
            echo "=== PR #$PR ==="
            # REST (not GraphQL `gh pr view`): observed 403s on view calls.
            if ! info=$(gh api "repos/$REPO/pulls/$PR" \
              --jq '{draft, author: .user.login, sha: .head.sha, branch: .head.ref,
                     mergeable, state: .mergeable_state}'); then
              echo "warn: pull API failed — will retry on next event"; continue
            fi
            echo "pull ok"

            draft=$(echo "$info" | jq -r .draft)
            author=$(echo "$info" | jq -r .author)
            sha=$(echo "$info" | jq -r .sha)
            mergeable=$(echo "$info" | jq -r .mergeable)
            mergestate=$(echo "$info" | jq -r .state)

            [ "$draft" = "true" ] && { echo "skip: draft"; continue; }
            if [ "$author" != "$OWNER" ] && [ "$author" != "dependabot[bot]" ]; then
              echo "skip: author $author not in allowlist"; continue
            fi
            # mergeable=true + state=clean|unstable|has_hooks (null/computing -> retry later).
            if [ "$mergeable" != "true" ]; then
              echo "skip: mergeable=$mergeable state=$mergestate (conflict or computing)"; continue
            fi

            # Reviews: latest state per user (API returns oldest-first);
            # block on unresolved change requests.
            if ! reviews=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
              --jq '[.[] | {user: .user.login, state: .state, at: .submitted_at}]'); then
              echo "warn: reviews API failed — will retry on next event"; continue
            fi
            latest=$(echo "$reviews" | jq '
              sort_by(.at) | group_by(.user) | map(max_by(.at))')
            if echo "$latest" | jq -e '
              map(select(.state=="CHANGES_REQUESTED")) | length > 0
            ' >/dev/null; then
              echo "skip: unresolved CHANGES_REQUESTED"; continue
            fi

            # Dependabot PRs need 1 human approval (owner's own PRs: label == approval).
            if [ "$author" = "dependabot[bot]" ]; then
              if ! echo "$latest" | jq -e '
                map(select(.state=="APPROVED" and .user!="dependabot[bot]")) | length > 0
              ' >/dev/null; then
                echo "skip: dependabot PR needs human approval"; continue
              fi
            fi

            # Required checks on the head SHA must both be success.
            if ! checks=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name=="test" or .name=="security")
                     | {name, status, conclusion}]'); then
              echo "warn: check-runs API failed — will retry on next event"; continue
            fi
            if ! echo "$checks" | jq -e '
              length == 2 and all(.status=="completed" and .conclusion=="success")
            ' >/dev/null; then
              echo "skip: checks not green:"; echo "$checks"; continue
            fi

            echo "MERGE: #$PR (author=$author sha=$sha)"
            # REST merge (squash) + branch delete — no GraphQL dependency.
            gh api "repos/$REPO/pulls/$PR/merge" -X PUT \
              -f merge_method=squash \
              -f commit_title="Merge pull request #$PR" >/dev/null
            branch=$(echo "$info" | jq -r .branch)
            gh api "repos/$REPO/git/refs/heads/$branch" -X DELETE \
              >/dev/null && echo "deleted branch $branch"
          done
