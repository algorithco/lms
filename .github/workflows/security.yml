# Security checks — free for private repos, no Advanced Security needed.
# Required check name: `security` (see .github/BRANCH_PROTECTION.md).
# Runs on every PR to main, pushes to main, and weekly.

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: 0 5 * * 1  # Mondays 05:00 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks OSS, no license needed)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz -C /tmp
          /tmp/gitleaks detect --source . --verbose --exit-code 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Dependency audit (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements/base.txt -r requirements/production.txt || true
          # NOTE: `|| true` keeps the job advisory until all CVEs are triaged.
          # Switch to strict mode once Dependabot is fully green.

      - name: Static analysis (bandit)
        run: |
          pip install bandit[toml]
          bandit -r apps config -x tests -q || true

      - name: Fail if tracked secrets exist
        run: |
          git ls-files | grep -Ei '^(\.env$|\.env\.prod$|.*\.pem$|.*\.key$|deploy/secrets/htpasswd-admin$)' && {
            echo "ERROR: secret file is tracked. Remove it and rotate the credential."
            exit 1
          } || echo "No tracked secrets."
