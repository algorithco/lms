# ============================================================================
# LMS Platform — Nginx main config (production, http-level)
#
# Mounted by docker-compose.prod.yml OVER the stock image config:
#   ./deploy/nginx/nginx-main.conf → /etc/nginx/nginx.conf:ro
# Server blocks stay in deploy/nginx/nginx.conf (conf.d/default.conf).
#
# Why a custom main config:
#   1. limit_req_zone MUST live in http{} (cannot be in server{}), and our
#      server file is included from conf.d — zones are defined here once.
#   2. Cloudflare proxy (orange cloud) hides client IPs: without
#      set_real_ip_from + CF-Connecting-IP, EVERY visitor looks like a
#      Cloudflare edge IP and rate limits would ban Cloudflare itself.
#   3. File logs for host fail2ban (deploy/logs/*.log) alongside stderr
#      so `docker logs` keeps working.
# ============================================================================

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
error_log stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main buffer=32k;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # ------------------------------------------------------------------
    # Docker DNS for upstreams (REQUIRED for zero-touch recovery).
    # `web` gets a NEW container IP on every recreate (deploy/restart);
    # plain `proxy_pass http://web:8000` resolves ONCE at nginx start and
    # then dials the dead IP forever (classic 502-until-reload outage).
    # All proxy_pass below use `set $upstream_web web:8000` + variable so
    # nginx re-resolves via Docker DNS (127.0.0.11) at most every 10s.
    # NOTE: prod-only file — never mount where 127.0.0.11 doesn't exist.
    # ------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ------------------------------------------------------------------
    # Real client IP behind Cloudflare (orange cloud ON).
    # Ranges: https://www.cloudflare.com/ips (IPv4 + IPv6). Re-sync yearly;
    # stale ranges only risk mis-attributed IPs, never downtime.
    # ------------------------------------------------------------------
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    # IPv4
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # IPv6
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # ------------------------------------------------------------------
    # Rate-limit zones (all keyed by REAL client IP, see above).
    #
    # Design (school-NAT safe): authenticated app traffic is throttled
    # per-USER by DRF (anon 30/min, user 100/min), so nginx limits ONLY:
    #   login — brute-force sensitive auth endpoints: 10 req/min + burst 5.
    #           A human retries a password a few times; a bot fires 100s.
    #   admin — whole admin host + panel paths: 30 req/min + burst 10.
    #           Staff traffic is human-scale; bots get cut fast.
    # No general zone on purpose: a classroom behind one NAT IP must never
    # share a bucket (100 pupils x quiz autosave would self-DoS).
    # ------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=30r/m;

    include /etc/nginx/conf.d/*.conf;
}
