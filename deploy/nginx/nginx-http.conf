# ============================================================================
# LMS Platform — Nginx (first run, no SSL yet)
#
# Used ONLY during initial Let's Encrypt issuance: serves the ACME challenge
# and proxies everything else to the app. The init-letsencrypt.sh script
# replaces this file with nginx-ssl.conf once certificates exist.
# ============================================================================

# WebSocket upgrade mapping (Arena real-time quiz)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Django static files
    location /static/ {
        alias /app/staticfiles/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # User-uploaded media
    location /media/ {
        alias /app/media/;
        expires 30d;
    }

    # Rejections answer 429 (not 503); logged for host fail2ban.
    # Zones are defined in nginx-main.conf (shared with the HTTPS template).
    limit_req_status 429;
    limit_req_log_level warn;

    # Django app (HTTP + WebSocket)
    location /ws/ {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Telegram web-login status polling (every 2s by design) — no limit_req
    # here by design (no server-level limit on this host either).
    # MUST stay before the login regex below (first matching regex wins).
    location ~ ^/api/notifications/telegram/auth/[^/]+/status/$ {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Brute-force sensitive auth endpoints — 10 req/min per real client IP.
    location ~ ^/(api/auth/|api/notifications/telegram/auth/|tma/api/auth/|login|register|password-reset) {
        limit_req zone=login burst=5 nodelay;

        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Django app (HTTP + WebSocket)
    location / {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Arena)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Upload size limit (essay attachments, avatars, ...)
    client_max_body_size 10M;
}