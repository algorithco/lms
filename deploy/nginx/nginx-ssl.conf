# ============================================================================
# LMS Platform — Nginx (production, HTTPS) for grandec.uz
#
# TLS: Cloudflare Origin certificate (VPS-side secret, 15y), NOT Let's
# Encrypt. Files live at ./deploy/secrets/ (chmod 600, git-ignored except
# *.example) and are mounted read-only to /etc/nginx/secrets/.
# The old LE flow (init-letsencrypt.sh / certbot) is retired for this site
# but kept dormant in compose (profile: legacy-le) for other domains.
# ============================================================================

# WebSocket upgrade mapping (Arena real-time quiz)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS redirect (with ACME challenge passthrough)
server {
    listen 80;
    listen [::]:80;
    server_name grandec.uz www.grandec.uz admin.grandec.uz;

    # Let's Encrypt renewal (webroot method)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Docker healthcheck must stay on HTTP 200 (not 301) so `nginx`
    # service never flips to unhealthy after TLS goes live.
    location = /healthz/ {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grandec.uz www.grandec.uz;

    # Origin certificates (Cloudflare, VPS-side secret — see header).
    # No trusted_certificate: OCSP stapling is OFF at origin on purpose
    # (Cloudflare edge staples to browsers; origin stapling adds nothing
    # but a failure mode without the Origin CA root on disk).
    ssl_certificate     /etc/nginx/secrets/origin.pem;
    ssl_certificate_key /etc/nginx/secrets/origin.key;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling off;
    # Docker DNS (NOT public DNS): `web` is a compose service name — only
    # 127.0.0.11 resolves it. Public resolvers = permanent 502 after recreate.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers (Django sets its own too)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate-limit rejections answer 429 (not 503) so TMA/JS clients can
    # distinguish "slow down" from "server broken". Rejections are logged
    # (warn) to error.log for host fail2ban (nginx-limit-req jail).
    limit_req_status 429;
    limit_req_log_level warn;

    # Django static files (collected at startup into /app/staticfiles)
    # Served directly by nginx (bypasses WhiteNoise) — enable precompressed
    # variants created by `collectstatic` (CompressedManifestStaticFilesStorage).
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /app/staticfiles/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # User-uploaded media
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Arena WebSockets — long-lived, never buffer, generous timeouts.
    location /ws/ {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Django app (HTTP + polling). Fast failure for hung app workers;
    # WS traffic must use /ws/ above.
    #
    # React SPA (built into the image at /app/spa, published to the shared
    # spa_volume by the web entrypoint). Deep links fall back to index.html
    # for React Router; Django only sees the API/session prefixes below.
    location /assets/ {
        root /app/spa;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /sw.js {
        root /app/spa;
        # The service worker must never be cached or clients pin old bundles.
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # Liveness stays a Django check (the SPA shell would also answer 200,
    # which would hide an app outage from monitoring).
    location ^~ /healthz/ {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        access_log off;
    }

    # Django API/session prefixes (plain prefix locations: the regex
    # rate-limit blocks below still win wherever they match).
    location /api/ {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location /essays/ {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location /arena/ {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location /subscribe/ {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location /tma/ {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location /admin/ {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # SPA shell — everything else is a client route.
    location / {
        root /app/spa;
        try_files $uri $uri/ /index.html;
    }

    # Telegram web-login status polling (login.html polls every 2s while the
    # user confirms in Telegram) is high-frequency by design — exempt it by
    # simply NOT setting limit_req here (no server-level limit on main host).
    # The token is unguessable (600s TTL) and brute force gains nothing:
    # statuses are per-token, no passwords involved. MUST stay before the
    # login regex below (first matching regex wins).
    location ~ ^/api/notifications/telegram/auth/[^/]+/status/$ {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Brute-force sensitive auth endpoints — 10 req/min per real client IP
    # (zone defined in nginx-main.conf). Covers: DRF /api/auth/* (login,
    # register, token refresh, password reset, Google/Telegram connect),
    # TMA /tma/api/auth/, Telegram web-login /api/notifications/telegram/auth/*.
    # The old web /login /register /password-reset* HTML pages are gone (the
    # SPA owns those paths now), so they are intentionally NOT matched here.
    # Legit humans retry a few times; bots firing 100s get 429 + fail2ban.
    location ~ ^/(api/auth/|api/notifications/telegram/auth/|tma/api/auth/) {
        limit_req zone=login burst=5 nodelay;

        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Upload size limit (essay attachments, avatars, ...)
    client_max_body_size 10M;
}

# ============================================================================
# Admin host — second gate in front of Django auth (gap #3).
#
# Layers: Cloudflare Access (Zero Trust, email OTP — dashboard side, see
# DEPLOYMENT docs) → nginx Basic Auth here (username `lmsadmin`, password
# provisioned ONLY on the VPS via deploy/setup-admin-auth.sh) → Django
# login + is_platform_admin. No static IP needed.
#
# Credential file is a VPS-side secret, bind-mounted read-only:
#   ./deploy/secrets/htpasswd-admin → /etc/nginx/.htpasswd-admin
# Missing/wrong file fails closed (401 for everyone, never open).
# Strict host-split of /admin + /control-panel URLs lands in Phase 3
# (AdminHostMiddleware); until then this host proxies the same app.
# ============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.grandec.uz;

    # Same Origin certificates (SAN covers apex + wildcard, see header).
    # No trusted_certificate: stapling OFF at origin (edge staples).
    ssl_certificate     /etc/nginx/secrets/origin.pem;
    ssl_certificate_key /etc/nginx/secrets/origin.key;

    # TLS hardening (same as main host)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling off;
    # Docker DNS (NOT public DNS): `web` is a compose service name — only
    # 127.0.0.11 resolves it. Public resolvers = permanent 502 after recreate.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers (Django sets its own too)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_req_status 429;
    limit_req_log_level warn;

    # ---- Gate: HTTP Basic Auth (VPS-side htpasswd, username `lmsadmin`) ----
    auth_basic "Admin";
    auth_basic_user_file /etc/nginx/.htpasswd-admin;

    # Django static files (admin panel needs its CSS/JS too).
    # No limit_req on this host except location / below: one page load pulls
    # ~10-20 assets at once and they are cheap cacheable files (Basic Auth
    # still required for every request).
    location /static/ {
        alias /app/staticfiles/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # User-uploaded media
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Django app (admin has no Arena — single location is enough).
    # Whole dynamic admin surface: 30 req/min per real client IP (staff
    # traffic is human-scale; Basic Auth attackers get 429 + fail2ban).
    location / {
        limit_req zone=admin burst=10 nodelay;

        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    client_max_body_size 10M;
}