# ============================================================================
# LMS Platform — Nginx (first run, no SSL yet)
#
# Used ONLY during initial Let's Encrypt issuance: serves the ACME challenge
# and proxies everything else to the app. The init-letsencrypt.sh script
# replaces this file with nginx-ssl.conf once certificates exist.
# ============================================================================

# WebSocket upgrade mapping (Arena real-time quiz)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Django static files
    location /static/ {
        alias /app/staticfiles/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # User-uploaded media
    location /media/ {
        alias /app/media/;
        expires 30d;
    }

    # Django app (HTTP + WebSocket)
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Arena)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Upload size limit (essay attachments, avatars, ...)
    client_max_body_size 10M;
}